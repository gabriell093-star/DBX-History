name: Validate DBX History

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify site and share metadata
        run: |
          python - <<'PY'
          import json
          import re
          import struct
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("app.js").read_text(encoding="utf-8")
          function_js = Path("supabase/functions/username-login/index.ts").read_text(encoding="utf-8")
          config = json.loads(Path("vercel.json").read_text(encoding="utf-8"))
          image = Path("dbx-og-image.png").read_bytes()
          poster_svg = Path("dbx-s1-registration-poster.svg").read_text(encoding="utf-8")

          assert '<html lang="id">' in html, "HTML language should be Indonesian"
          assert 'property="og:title"' in html, "Missing Open Graph title"
          assert 'property="og:description"' in html, "Missing Open Graph description"
          assert 'property="og:image"' in html, "Missing Open Graph image"
          assert 'name="twitter:card" content="summary_large_image"' in html, "Missing Twitter large card"
          assert 'property="og:url" content="https://dbx-history.vercel.app/"' in html, "Missing canonical Open Graph URL"
          assert 'property="og:image" content="https://dbx-history.vercel.app/dbx-og-image.png?v=20261028-3"' in html, "Missing root-served, cache-busted raster preview"
          assert len(re.findall(r'property="og:image"', html)) == 1, "Use one unambiguous Open Graph image"
          assert image[:8] == b"\x89PNG\r\n\x1a\n", "Social preview asset is not PNG"
          width, height = struct.unpack(">II", image[16:24])
          assert (width, height) == (1200, 630), f"Expected committed 1200x630 image, got {width}x{height}"
          assert "admin_users" in js and "/functions/v1/username-login" in js, "Username login integration missing"
          assert "signInWithPassword" in function_js and "admin_usernames" in function_js, "Backend username login missing"
          assert "<svg" in poster_svg and "</svg>" in poster_svg, "DBX registration poster SVG is missing or malformed"
          assert "08828671206" in poster_svg and "081225974441" in poster_svg, "Poster WhatsApp numbers missing"
          assert "RP100.000" in poster_svg and "1–3 OKT" in poster_svg, "Poster prize or registration period missing"
          assert "dbx-s1-registration-poster.svg" in js and "./dbx-s1-registration-poster.svg" in js, "Root registration poster is not referenced by the tournament page"
          assert "async function queryAllRows" in js and ".range(start, start + pageSize - 1)" in js, "Public archive must paginate all rows"
          assert "async function queryRowsEqual" in js and 'queryRowsEqual("match_characters"' in js, "Champion character history must paginate all rows"
          assert 'label: "Longest win streak"' in js and 'label: "Tournament appearances"' in js, "Fun Fact must offer date-aware streaks and confirmed appearances"
          assert "normalizeName(item.display_name)" in js and "debaters_display_name_normalized_unique_idx" in js, "Duplicate Debatter names need UI and database validation"
          assert '.trim().replace(/\\s+/g, " ").toLocaleLowerCase("id-ID")' in js, "Debatter name normalization must collapse whitespace"
          assert Path("supabase/migrations/202610280004_unique_debatter_display_name.sql").exists(), "Normalized Debatter uniqueness migration missing"
          assert 'queryAllRows(config.table, "*", "created_at", false)' in js, "Admin lists must not silently cap archive records"
          assert "Win rate" in js and "Kekalahan" in js and "Riwayat pertandingan" in js, "Champion profiles missing source-backed match metrics"
          assert ".tournament-poster-detail" in Path("styles.css").read_text(encoding="utf-8"), "Tournament detail poster styling missing"
          assert ".admin-shell { grid-template-columns: minmax(0, 1fr); gap: 14px; }" in Path("styles.css").read_text(encoding="utf-8"), "Responsive single-column admin layout missing"
          assert "wa.me/628828671206" in js and "wa.me/6281225974441" in js, "Both WhatsApp registration links must be present"
          assert 'placeholder="Masukkan username"' in js, "Admin username field should not contain a preset user"
          assert "setup-two-founders.sql" in Path("README.md").read_text(encoding="utf-8"), "Founder setup instructions missing"
          assert config.get("headers"), "Expected static-site security headers in vercel.json"
          assert config.get("outputDirectory") == ".", "Vercel must serve the repository root containing index.html"
          assert any(item.get("destination") == "/index.html" for item in config.get("rewrites", [])), "Missing SPA fallback rewrite"
          print(f"OK: metadata and social preview PNG ({width}x{height}); username login, tournament poster, WhatsApp links and static Vercel config parsed.")
          PY
