name: Validate DBX History

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify site and share metadata
        run: |
          python - <<'PY'
          import json
          import re
          import struct
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("app.js").read_text(encoding="utf-8")
          config = json.loads(Path("vercel.json").read_text(encoding="utf-8"))
          image = Path("public/dbx-og-image.png").read_bytes()

          assert '<html lang="id">' in html, "HTML language should be Indonesian"
          assert 'property="og:title"' in html, "Missing Open Graph title"
          assert 'property="og:description"' in html, "Missing Open Graph description"
          assert 'property="og:image"' in html, "Missing Open Graph image"
          assert 'name="twitter:card" content="summary_large_image"' in html, "Missing Twitter large card"
          assert "public/dbx-og-image.png" in html, "Social preview image path not present"
          assert image[:8] == b"\x89PNG\r\n\x1a\n", "Social preview asset is not PNG"
          width, height = struct.unpack(">II", image[16:24])
          assert (width, height) == (1200, 630), f"Expected 1200x630 image, got {width}x{height}"
          assert "admin_users" in js and "signInWithPassword" in js, "Admin auth checks missing"
          assert config.get("headers"), "Expected static-site security headers in vercel.json"
          print(f"OK: metadata and social preview PNG ({width}x{height}); static Vercel config parsed.")
          PY
